name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_HOST: tcp://dind:2375

jobs:
  build:
    runs-on: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build, scan and push
        uses: https://git.kodu.lenn.uk/websites/ci-actions/docker-build-scan-push@81003ac5e4137628f8f80b7d7302566c3a052cb0 # v1.3.0
        with:
          image: git.kodu.lenn.uk/websites/kasterpalu-ee_web
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
          build-args: |
            APK_CACHE_BUST=${{ github.run_id }}

      - name: Trigger deploy
        uses: https://git.kodu.lenn.uk/websites/ci-actions/komodo-deploy@81003ac5e4137628f8f80b7d7302566c3a052cb0 # v1.3.0
        with:
          webhook: ${{ vars.KOMODO_DEPLOY_WEBHOOK }}
          secret: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
