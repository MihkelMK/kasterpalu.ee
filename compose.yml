---
name: 'kasterpalu.ee'
services:
  web:
    container_name: 'kasterpalu-web'
    build:
      context: .
    environment:
      - CLIENT_ID
      - CLIENT_SECRET
      - SESH_SECRET
      - ALTCHA_HMAC
      - UPSTASH_REDIS_URL
      - UPSTASH_REDIS_TOKEN
      # SQLite file inside the db volume. entrypoint.sh defaults to the same path.
      - DATABASE_URL=/app/data/local.db
      - NODE_ENV=production
    volumes:
      - db:/app/data
    restart: unless-stopped
    ports:
      - 9000:3000
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --tries=1 --spider http://127.0.0.1:3000 || exit 1']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    security_opt:
      - no-new-privileges:true

volumes:
  db:
